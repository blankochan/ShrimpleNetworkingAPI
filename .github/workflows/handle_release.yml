name: Handle Release
on:
  release:
    types: [prereleased]

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Fetch Changelog
        id: fetch_changelog
        run: echo changelog=$(cat ${{github.workspace}}/CHANGELOG.md) >> $GITHUB_OUTPUT
      - name: Process and Add Notes
        uses: blankochan/ShrimpleBuilder/format_release@master
        with:
          changelog: ${{steps.fetch_changelog.outputs.changelog}}
          tag: ${{ github.event.release.tag_name }}
  build_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build Release
        uses: blankochan/ShrimpleBuilder/build@master
        with:
          configuration: "Release"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: .build/*.dll
