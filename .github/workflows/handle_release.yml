name: Handle Release
on: release

jobs:
  format:
    if: contains(github.event.release.body,'autoRelease')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Add Changelog
        uses: blankochan/ShrimpleBuilder/format_release@master
        with:
          tag: ${{ github.event.release.tag_name }}
  build_and_upload:
    if: contains(github.event.release.body,'autoRelease')
    strategy:
      matrix:
        target_beta:
          - BETA_4
          - BETA_5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build Release
        uses: blankochan/ShrimpleBuilder/build@master
        with:
          rename: true
          active_dependencies: ${{matrix.target_beta}}
          constants: ${{matrix.target_beta}}
          configuration: "Release"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: .build/*.dll
